<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dynatrace Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-12 col-md-3 col-xl-2 bg-dark text-white p-4">
                <h1 class="h4 mb-4">Dynatrace Management</h1>
                <nav class="nav flex-column gap-2">
                    <a class="nav-link text-white px-0" href="/">Dashboard</a>
                    <a class="nav-link text-white px-0" href="/account-management/">Account Management</a>
                    <a class="nav-link text-white px-0" href="/environment/">Environment</a>
                    <a class="nav-link text-white px-0" href="/platform/">Platform</a>
                    <a class="nav-link text-white px-0" href="/terraform/">Terraform</a>
                </nav>
            </aside>
            <main class="col-12 col-md-9 col-xl-10 p-4 p-lg-5">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
